[build]
  publish = "."
  functions = "netlify/functions"

# Evita que o navegador guarde uma versao antiga do service worker ou do
# app em cache por muito tempo, o que "prende" o usuario numa versao velha
# ate 24h depois de um novo deploy. Sempre revalida com o servidor.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"
